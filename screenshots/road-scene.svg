<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<title id="title">Endless Roads — driving into the sunset</title>
<desc id="desc">A stylized sports car on a winding mountain highway, with road markings and traffic ahead beneath a warm sunset sky.</desc>
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#101b38"/><stop offset=".42" stop-color="#8b416b"/><stop offset=".72" stop-color="#ffad68"/><stop offset="1" stop-color="#ffd28a"/></linearGradient>
  <radialGradient id="sun"><stop stop-color="#fff5cf"/><stop offset=".48" stop-color="#ffd788"/><stop offset="1" stop-color="#ff9d69" stop-opacity="0"/></radialGradient>
  <linearGradient id="road" x2="0" y2="1"><stop stop-color="#52576a"/><stop offset="1" stop-color="#252b3b"/></linearGradient>
  <linearGradient id="car" x2="0" y2="1"><stop stop-color="#ffdb8a"/><stop offset=".45" stop-color="#ff741f"/><stop offset="1" stop-color="#ad285a"/></linearGradient>
  <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#b8efff"/><stop offset="1" stop-color="#345175"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
  <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#fff" opacity=".16"/></pattern>
</defs>
<rect width="1440" height="800" fill="url(#sky)"/>
<circle cx="1040" cy="326" r="178" fill="url(#sun)"/>
<circle cx="1040" cy="326" r="69" fill="#ffe4a3" opacity=".93"/>
